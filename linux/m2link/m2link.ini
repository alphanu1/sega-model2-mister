; m2link -- link play for the Sega Model 2 core (Daytona USA Revision A)
; Copy to /media/fat/linux/m2link.ini and set link_next.
;
; Only the network goes here, in the same names and with the same defaults
; as the Daytona USA recompilation's launcher, so a MiSTer and a PC running
; the recomp link with nothing more than the addresses filled in.
;
; Master or slave and the car number are NOT set here: they are the game's
; own settings, in test mode > GAME SYSTEM > LINK ID (one MASTER, the
; others SLAVE) and CAR NUMBER (a different one on each cabinet).
;
; The cabinets form a ring: each one listens for the cabinet before it and
; connects to the cabinet after it. With two cabinets, each one's next is
; the other.

; This cabinet listens on this port (the cabinet before it connects here).
link_port = 15112

; The next cabinet in the ring: its IP address and its link_port.
link_next = 192.168.1.20:15112

; Advanced, leave at 0 (the recomp's default too). 1 makes this cabinet wait
; for the master's frame token, as MAME's -comm_framesync does. On MiSTer
; the game itself cannot be held, so 1 changes nothing you can see; the
; setting is read so the file matches the recomp's.
link_framesync = 0
